- legacy_id: "CMP-09"
  legacy_title: "Référentiel des métadonnées d'exploitation (ART-4)"
  legacy_type: "composant-applicatif"
  disposition: "merged"
  primary_replacement: "CMP-10"
  replacement_ids: ["CMP-10"]
  rationale: >-
    CMP-09 et CMP-10 partagent la même signature relationnelle : ils
    implémentent ART-4, s'appliquent aux mêmes processus et accèdent aux mêmes
    sept terminologies. CMP-09 se déclarait rattaché au bloc de gestion du
    consentement, ce que son propre contenu contredit : il décrit l'autorité
    sémantique de la plateforme, c'est-à-dire le registre des terminologies.
    La fusion est conservée sous l'identifiant CMP-10, dont la correspondance
    avec le bloc de terminologie est exacte.
