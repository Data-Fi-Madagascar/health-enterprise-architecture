- legacy_id: "BO-06"
  legacy_title: "Exploitation & gestion"
  legacy_type: "objet-metier"
  disposition: "retired"
  theme: "exploitation-gestion"
  replacement_ids: ["DO-23", "DO-24", "DO-25", "DO-26", "DO-27"]
  rationale: >-
