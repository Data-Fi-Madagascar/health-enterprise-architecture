name: Release PDF

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pandoc + LaTeX + font
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-french fonts-dejavu-core
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Garde-fou (enveloppes à jour + liens)
        run: |
          python3 scripts/build_wrappers.py --check
          python3 scripts/check_links.py
        working-directory: ${{ github.workspace }}

      - name: Build PDFs
        run: |
          export TAG_VERSION=${{ steps.ver.outputs.VERSION }}
          python3 scripts/build_pdf.py --engine xelatex --font "DejaVu Sans"
        working-directory: ${{ github.workspace }}

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.pdf \
            --title "v${GITHUB_REF_NAME#v} — Santé numérique de Madagascar" \
            --generate-notes \
            --latest