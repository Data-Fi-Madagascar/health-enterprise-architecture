name: Release DOCX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Garde-fou (enveloppes à jour + liens)
        run: |
          python3 scripts/build_wrappers.py --check
          python3 scripts/check_links.py
        working-directory: ${{ github.workspace }}

      - name: Build DOCXs
        run: |
          export TAG_VERSION=${{ steps.ver.outputs.VERSION }}
          python3 scripts/build_docx.py
        working-directory: ${{ github.workspace }}

      - name: List artifacts
        run: ls -la dist/

      - name: Generate release notes
        id: notes
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-decorate | head -20)
          else
            COMMITS=$(git log --oneline --no-decorate ${PREV_TAG}..HEAD)
          fi
          
          # Count files
          MD_COUNT=$(find . -name "*.md" -not -path "./.git/*" -not -path "./dist/*" | wc -l | tr -d ' ')
          YAML_COUNT=$(find . -name "*.yaml" -o -name "*.yml" | grep -v ".git" | wc -l | tr -d ' ')
          PY_COUNT=$(find . -name "*.py" | grep -v ".git" | wc -l | tr -d ' ')
          
          # Create release notes
          cat > /tmp/release_notes.md << EOF
## Architecture d'Entreprise de la Santé Numérique de Madagascar

### Documents inclus

| Document | Description |
|----------|-------------|
| caesn-v*.docx | Cadre d'Architecture d'Entreprise de la Santé Numérique (CAESN) |
| cnisn-v*.docx | Cadre National d'Interopérabilité de la Santé Numérique (CNISN) |
| artsn-v*.docx | Architecture de Référence Technique de la Santé Numérique (ARTSN) |
| ptisn-v*.docx | Profils techniques d'implémentation de la Santé Numérique (PTISN) |
| HEA-v*.docx | Document consolidé (tous niveaux) |

### Statistiques

- **Markdown** : ${MD_COUNT} fichiers
- **YAML** : ${YAML_COUNT} fichiers
- **Python** : ${PY_COUNT} fichiers

### Changements

\`\`\`
${COMMITS}
\`\`\`
EOF
          
          # Escape multiline for GitHub output
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.docx \
            --title "v${GITHUB_REF_NAME#v} — Santé numérique de Madagascar" \
            --notes "${{ steps.notes.outputs.body }}" \
            --latest
