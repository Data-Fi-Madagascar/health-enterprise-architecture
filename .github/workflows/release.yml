name: Release DOCX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Garde-fou (enveloppes à jour + liens)
        run: |
          python3 scripts/build_wrappers.py --check
          python3 scripts/check_links.py
          python3 scripts/validate_ref.py
        working-directory: ${{ github.workspace }}

      - name: Compile RDF + SHACL validation
        run: |
          python3 scripts/compile_rdf.py
          python3 scripts/compile_rdf.py --validate
        working-directory: ${{ github.workspace }}

      - name: Build DOCXs
        run: |
          export TAG_VERSION=${{ steps.ver.outputs.VERSION }}
          python3 scripts/build_docx.py
        working-directory: ${{ github.workspace }}

      - name: Build public DOCXs
        run: |
          export TAG_VERSION=${{ steps.ver.outputs.VERSION }}
          python3 scripts/build_docx_public.py
        working-directory: ${{ github.workspace }}

      - name: List artifacts
        run: |
          ls -la dist/
          ls -la dist/public/ 2>/dev/null || true

      - name: Generate release notes
        id: notes
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-decorate | head -20)
          else
            COMMITS=$(git log --oneline --no-decorate ${PREV_TAG}..HEAD)
          fi
          
          # Count files
          MD_COUNT=$(find . -name "*.md" -not -path "./.git/*" -not -path "./dist/*" | wc -l | tr -d ' ')
          YAML_COUNT=$(find . -name "*.yaml" -o -name "*.yml" | grep -v ".git" | wc -l | tr -d ' ')
          PY_COUNT=$(find . -name "*.py" | grep -v ".git" | wc -l | tr -d ' ')
          
          # Create release notes
          {
            echo "## Architecture d'Entreprise de la Santé Numérique de Madagascar"
            echo ""
            echo "### Documents internes (techniques)"
            echo ""
            echo "| Document | Description |"
            echo "|----------|-------------|"
            echo "| caesn-v*.docx | Cadre d'Architecture d'Entreprise de la Santé Numérique (CAESN) |"
            echo "| cnisn-v*.docx | Cadre National d'Interopérabilité de la Santé Numérique (CNISN) |"
            echo "| artsn-v*.docx | Architecture de Référence Technique de la Santé Numérique (ARTSN) |"
            echo "| ptisn-v*.docx | Profils techniques d'implémentation de la Santé Numérique (PTISN) |"
            echo "| HEA-v*.docx | Document consolidé (tous niveaux) |"
            echo ""
            echo "### Documents publics (décideurs, directeurs, PTF)"
            echo ""
            echo "| Document | Description |"
            echo "|----------|-------------|"
            echo "| caesn-public-v*.docx | CAESN — sans jargon technique |"
            echo "| cnisn-public-v*.docx | CNISN — sans jargon technique |"
            echo "| artsn-public-v*.docx | ARTSN — sans jargon technique |"
            echo "| HEA-public-v*.docx | Combinaison des 3 niveaux publics |"
            echo ""
            echo "### Statistiques"
            echo ""
            echo "- **Markdown** : ${MD_COUNT} fichiers"
            echo "- **YAML** : ${YAML_COUNT} fichiers"
            echo "- **Python** : ${PY_COUNT} fichiers"
            echo ""
            echo "### Changements"
            echo ""
            echo '```'
            echo "$COMMITS"
            echo '```'
          } > /tmp/release_notes.md
          
          # Escape multiline for GitHub output
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.docx \
            dist/public/*.docx \
            --title "v${GITHUB_REF_NAME#v} — Santé numérique de Madagascar" \
            --notes "${{ steps.notes.outputs.body }}" \
            --latest
